name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --no-interaction
      - run: vendor/bin/phpunit tests
      - run: git archive --format=zip -o watchtower-php-$GITHUB_REF_NAME.zip HEAD
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'watchtower-php-*.zip'
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" watchtower-php-*.zip --generate-notes --verify-tag
